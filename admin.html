<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de Administración · Menú del Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #2e2219; --muted: #6c757d;
    --primary: #b83a2a; --primary-hover: #962e21; --line: #e2e8f0;
    --success: #1e9e50; --warning: #d97706; --danger: #dc2626;
    --radius: 14px; --shadow: 0 4px 12px rgba(0,0,0,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Nunito", sans-serif; background: var(--bg); color: var(--text); padding: 16px; max-width: 900px; margin: 0 auto; line-height: 1.5; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--line); }
  h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
  .user-bar { font-size: 0.9rem; font-weight: 700; display: flex; gap: 10px; align-items: center; }
  .btn-sm { padding: 6px 12px; border-radius: 8px; border: 0; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
  .btn-danger { background: var(--danger); color: white; }

  .auth-card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); max-width: 400px; margin: 40px auto; text-align: center; }
  .auth-card input { width: 100%; padding: 12px; margin: 8px 0 16px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 1rem; }

  .grid-panel { display: grid; gap: 20px; grid-template-columns: 1fr; }
  @media(min-width: 768px) { .grid-panel { grid-template-columns: 1fr 1fr; } }

  .card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .card h2 { font-size: 1.2rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1.5px solid var(--line); padding-bottom: 8px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
  .field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 0.95rem; }
  .field textarea { min-height: 70px; resize: vertical; }

  .btn-main { width: 100%; padding: 14px; background: var(--primary); color: white; border: 0; border-radius: 12px; font-weight: 800; font-size: 1.05rem; cursor: pointer; margin-top: 10px; }
  .btn-main:hover { background: var(--primary-hover); }

  /* Ensaladas Manager UI */
  .ensaladas-box { background: #f8fafc; border: 1.5px solid var(--line); padding: 12px; border-radius: 10px; margin-top: 4px; }
  .ensaladas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 8px; }
  .ensalada-toggle { display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1.5px solid var(--line); padding: 8px 10px; border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer; user-select: none; }
  .ensalada-toggle input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
  .ensalada-toggle.off { opacity: 0.5; background: #e2e8f0; text-decoration: line-through; }
  .btn-reset-ensaladas { background: #e2e8f0; color: #334155; border: 0; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; margin-bottom: 8px; }

  .cocina-box { background: #fef3c7; border: 1.5px solid #f59e0b; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .cocina-box h3 { font-size: 1rem; color: #92400e; margin-bottom: 6px; }
  .cocina-items { font-weight: 700; font-size: 0.95rem; display: flex; flex-wrap: wrap; gap: 12px; }

  .pedido-item { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: white; position: relative; }
  .pedido-item.anulado { opacity: 0.5; background: #f1f5f9; }
  .pedido-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .cliente-title { font-weight: 800; font-size: 1.1rem; }
  .badge { font-size: 0.75rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
  .badge-foodpro { background: #dcfce7; color: #15803d; }
  .badge-europer { background: #f3e8ff; color: #6b21a8; }
  .badge-particular { background: #e0f2fe; color: #0369a1; }
  .badge-especial { background: #fef08a; color: #854d0e; margin-left: 4px; }

  .pedido-body { font-size: 0.95rem; color: #334155; margin: 6px 0; }
  .pedido-nota { font-style: italic; color: #64748b; font-size: 0.85rem; margin-top: 4px; }
  .pedido-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .pedido-total { font-weight: 800; color: var(--primary); font-size: 1.05rem; }

  .hidden { display: none !important; }
  .acciones { display: flex; gap: 8px; }
  .btn-ticket { background: var(--text); color: white; }
  .ancho { font-size: 0.85rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; margin: -6px 0 12px; }
  .ancho select { padding: 4px 8px; border: 1.5px solid var(--line); border-radius: 8px; font: inherit; }

  #ticket { display: none; }
  @media print {
    body.print-ticket { background: #fff; margin: 0; padding: 0; max-width: none; }
    body.print-ticket > *:not(#ticket) { display: none !important; }
    body.print-ticket #ticket { display: block; color: #000; font: 12px/1.35 "Courier New", ui-monospace, monospace; padding: 2mm 3mm 4mm; }
    #ticket.w80 { width: 80mm; } #ticket.w58 { width: 58mm; font-size: 11px; }
    #ticket .t-cli { font-weight: 700; font-size: 1.6em; line-height: 1.15; }
    #ticket .t-sep { border-top: 1px dashed #000; margin: 5px 0; }
    #ticket .t-cant { font-weight: 700; font-size: 1.2em; margin-bottom: 2px; }
    #ticket .t-item { font-size: 1.1em; padding-left: 3mm; text-indent: -3mm; }
    #ticket .t-item::before { content: "- "; }
    #ticket .t-obs { font-weight: 700; font-size: 1.1em; margin-top: 5px; border: 1px solid #000; padding: 2px 4px; }
  }
</style>
</head>
<body>

<div id="login-view" class="auth-card">
  <h2>🔑 Administrar Menú</h2>
  <p style="color:var(--muted); font-size:0.9rem; margin-top:4px;">Ingresa tus credenciales del local</p>
  <div class="field" style="margin-top:16px;">
    <input type="email" id="auth-email" placeholder="Correo electrónico">
    <input type="password" id="auth-pass" placeholder="Contraseña">
  </div>
  <button class="btn-main" id="btn-login">Iniciar Sesión</button>
</div>

<div id="admin-view" class="hidden">
  <header>
    <h1>👨‍🍳 Panel de Control</h1>
    <div class="user-bar">
      <span id="user-email"></span>
      <button class="btn-sm btn-danger" id="btn-logout">Salir</button>
    </div>
  </header>

  <div class="cocina-box">
    <h3>📊 Resumen del Día para Cocina</h3>
    <div class="cocina-items" id="summary-cocina">Cargando acumulados...</div>
  </div>

  <div class="grid-panel">
    <!-- Columna Izquierda: Configuración del Menú -->
    <section>
      <div class="card">
        <h2>📝 Menú del Día</h2>
        <div class="field">
          <label>Precio Menú General ($)</label>
          <input type="number" id="m-precio" placeholder="6500">
        </div>
        <div class="field">
          <label>Platos Principales (uno por línea)</label>
          <textarea id="m-principales" placeholder="Cazuela&#10;Lasaña&#10;Merluza Frita"></textarea>
        </div>
        <div class="field">
          <label>Agregados (uno por línea)</label>
          <textarea id="m-agregados" placeholder="Arroz&#10;Puré&#10;Papas Fritas"></textarea>
        </div>
        <div class="field">
          <label>Sopas (uno por línea)</label>
          <textarea id="m-entradas" placeholder="Sopa de Verduras&#10;Consomé"></textarea>
        </div>

        <!-- EDITAR Y ACTIVAR/DESACTIVAR ENSALADAS -->
        <div class="field">
          <label>🥗 Lista Maestra de Ensaladas (puedes agregar o quitar opciones escribiendo abajo, una por línea):</label>
          <textarea id="m-ensaladas-master" placeholder="Surtida&#10;Lechuga&#10;Betarraga&#10;Zanahoria&#10;Papas mayo&#10;Brócoli&#10;Pepino&#10;Tomate&#10;Chilena"></textarea>

          <div class="ensaladas-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <label style="margin:0; font-size:0.85rem;">⚡ Marcar disponibilidad para HOY:</label>
              <button type="button" class="btn-reset-ensaladas" id="btn-reset-ensaladas">🔄 Marcar todas disponibles</button>
            </div>
            <div class="ensaladas-grid" id="ensaladas-container">
              <!-- Se generan dinámicamente según lo escrito arriba -->
            </div>
          </div>
        </div>

        <div class="field">
          <label>Postres (uno por línea)</label>
          <textarea id="m-postres" placeholder="Flan&#10;Jalea"></textarea>
        </div>

        <!-- SECCIÓN DE PLATOS ESPECIALES / EUROPER -->
        <div class="field" style="margin-top:16px; background:#f8fafc; padding:12px; border-radius:10px; border:1px solid var(--line);">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:8px;">
            <input type="checkbox" id="m-especial-act" style="width:auto;">
            <b>Habilitar "Platos Especiales / Dietas" (Europer)</b>
          </label>
          <label style="font-size:0.85rem; color:var(--muted); margin-bottom:4px; display:block;">
            Platos Especiales disponibles hoy (uno por línea):
          </label>
          <textarea id="m-especiales" placeholder="Bistec a la plancha c/ arroz&#10;Pechuga de pollo al jugo c/ puré&#10;Dieta blanda médica"></textarea>
        </div>

        <button class="btn-main" id="btn-guardar">Guardar y Publicar Menú</button>
      </div>

      <div class="card">
        <h2>⚙️ Datos del Local</h2>
        <div class="field">
          <label>Nombre del Restaurante</label>
          <input type="text" id="i-nombre">
        </div>
        <div class="field">
          <label>Teléfono WhatsApp (Pedidos)</label>
          <input type="text" id="i-whatsapp" placeholder="5698801XXXX">
        </div>
        <div class="field">
          <label>Horario de Atención</label>
          <input type="text" id="i-horario">
        </div>
        <button class="btn-main" id="btn-guardar-info" style="background:#475569;">Actualizar Datos</button>
      </div>
    </section>

    <!-- Columna Derecha: Listado de Pedidos -->
    <section>
      <div class="card">
        <h2>📥 Pedidos Recibidos hoy</h2>
        <label class="ancho">🖨️ Papel del ticket
          <select id="ticket-ancho"><option value="80">80 mm</option><option value="58">58 mm</option></select>
        </label>
        <div id="pedidos-lista">Cargando pedidos...</div>
      </div>
    </section>
  </div>
</div>

<div id="ticket" aria-hidden="true"></div>
<style id="ticket-page"></style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4fIq_u9YM_wrkgepR5BIjvNvzd9VQ2lI",
    authDomain: "menurestaurant-235f7.firebaseapp.com",
    databaseURL: "https://menurestaurant-235f7-default-rtdb.firebaseio.com",
    projectId: "menurestaurant-235f7",
    storageBucket: "menurestaurant-235f7.firebasestorage.app",
    messagingSenderId: "159171586731",
    appId: "1:159171586731:web:d6de4ef7c020ff9b4de5ee"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const $ = id => document.getElementById(id);
  const clp = n => new Intl.NumberFormat('es-CL', { style:'currency', currency:'CLP', maximumFractionDigits:0 }).format(n || 0);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));

  const DEFAULT_ENSALADAS = ['Surtida', 'Lechuga', 'Betarraga', 'Zanahoria', 'Papas mayo', 'Brócoli', 'Pepino', 'Tomate', 'Chilena'];
  let ensaladasEstado = {};   // nombre -> true/false (solo en memoria; en Firebase se guarda la lista "ensaladas" disponibles)

  onAuthStateChanged(auth, user => {
    if (user) {
      $('login-view').classList.add('hidden');
      $('admin-view').classList.remove('hidden');
      $('user-email').textContent = user.email;
      cargarDatos();
    } else {
      $('login-view').classList.remove('hidden');
      $('admin-view').classList.add('hidden');
    }
  });

  $('btn-login').onclick = () => {
    const e = $('auth-email').value.trim();
    const p = $('auth-pass').value.trim();
    signInWithEmailAndPassword(auth, e, p).catch(err => alert('Error de inicio de sesión: ' + err.message));
  };

  $('btn-logout').onclick = () => signOut(auth);

  function getListaMasterEnsaladas() {
    const txt = $('m-ensaladas-master').value.split('\n').map(s => s.trim()).filter(Boolean);
    return txt.length ? txt : DEFAULT_ENSALADAS;
  }

  function renderEnsaladasAdmin() {
    const cont = $('ensaladas-container');
    cont.innerHTML = '';
    const lista = getListaMasterEnsaladas();
    lista.forEach(item => {
      const isAct = ensaladasEstado[item] !== false;
      const lab = document.createElement('label');
      lab.className = `ensalada-toggle ${isAct ? '' : 'off'}`;
      lab.innerHTML = `<input type="checkbox" ${isAct ? 'checked' : ''} data-ens="${esc(item)}"> <span>${esc(item)}</span>`;
      lab.querySelector('input').onchange = (e) => {
        ensaladasEstado[item] = e.target.checked;
        lab.classList.toggle('off', !e.target.checked);
      };
      cont.appendChild(lab);
    });
  }

  // Al escribir o borrar ensaladas en la caja de texto, se actualizan los switches automáticamente
  $('m-ensaladas-master').addEventListener('input', renderEnsaladasAdmin);

  $('btn-reset-ensaladas').onclick = () => {
    getListaMasterEnsaladas().forEach(item => { ensaladasEstado[item] = true; });
    renderEnsaladasAdmin();
  };

  function cargarDatos() {
    onValue(ref(db, 'menu'), snap => {
      const data = snap.val() || {};
      $('m-precio').value = data.precio || 6500;
      $('m-principales').value = (data.principales || []).join('\n');
      $('m-agregados').value = (data.agregados || []).join('\n');
      $('m-entradas').value = (data.entradas || []).join('\n');
      $('m-postres').value = (data.postres || []).join('\n');
      $('m-especial-act').checked = data.especialActivo !== false;
      $('m-especiales').value = (data.especiales || []).join('\n');

      const master = data.ensaladasMaster || DEFAULT_ENSALADAS;
      $('m-ensaladas-master').value = master.join('\n');

      // Disponibilidad: se deduce de la lista "ensaladas" publicada (la que ve el cliente)
      const disponibles = Array.isArray(data.ensaladas) ? data.ensaladas : null;
      ensaladasEstado = {};
      master.forEach(item => { ensaladasEstado[item] = disponibles ? disponibles.includes(item) : true; });
      renderEnsaladasAdmin();

      if (data.info) {
        $('i-nombre').value = data.info.nombre || '';
        $('i-whatsapp').value = data.info.whatsapp || '';
        $('i-horario').value = data.info.horario || '';
      }
    });

    onValue(ref(db, 'pedidos'), snap => {
      renderPedidos(snap.val() || {});
    });
  }

  $('btn-guardar').onclick = () => {
    const splitLines = id => $(id).value.split('\n').map(s => s.trim()).filter(Boolean);
    const masterList = getListaMasterEnsaladas();
    const ensaladasDisponibles = masterList.filter(item => ensaladasEstado[item] !== false);

    const menuData = {
      precio: Number($('m-precio').value) || 6500,
      principales: splitLines('m-principales'),
      agregados: splitLines('m-agregados'),
      entradas: splitLines('m-entradas'),
      ensaladasMaster: masterList,
      ensaladas: ensaladasDisponibles,
      // Ya no se guarda como objeto: un nombre con "/" o "." (ej. "Papas c/mayo") haría fallar el guardado
      ensaladasEstado: null,
      postres: splitLines('m-postres'),
      especialActivo: $('m-especial-act').checked,
      especiales: splitLines('m-especiales')
    };
    update(ref(db, 'menu'), menuData).then(() => alert('¡Menú actualizado exitosamente!')).catch(e => alert('Error: ' + e.message));
  };

  $('btn-guardar-info').onclick = () => {
    const infoData = {
      nombre: $('i-nombre').value.trim(),
      whatsapp: $('i-whatsapp').value.trim(),
      horario: $('i-horario').value.trim()
    };
    update(ref(db, 'menu/info'), infoData).then(() => alert('¡Información del local actualizada!')).catch(e => alert('Error: ' + e.message));
  };

  function renderPedidos(pedidosObj) {
    const cont = $('pedidos-lista');
    cont.innerHTML = '';
    const hoy = new Date().toDateString();
    const items = Object.keys(pedidosObj)
      .map(k => ({ id: k, ...pedidosObj[k] }))
      .filter(p => new Date(p.fecha).toDateString() === hoy)
      .reverse();

    if (!items.length) {
      cont.innerHTML = '<p style="color:var(--muted);">No hay pedidos registrados hoy.</p>';
      $('summary-cocina').innerHTML = 'Sin comandas ingresadas.';
      return;
    }

    let sopasCount = 0;
    let ensaladasCount = 0;
    let almuerzosCount = 0;

    pedidosHoy = {};
    items.forEach(p => {
      pedidosHoy[p.id] = p;
      if (p.estado !== 'anulado') {
        almuerzosCount += (Number(p.cantidad) || 1);
        // "Sopa: Sí" (formato actual) o "Sopa/Entrada: Sí" (pedidos antiguos)
        if (p.detalle && /sopa(\/entrada)?: sí/i.test(p.detalle)) {
          sopasCount += (Number(p.cantidad) || 1);
        }
        // Cualquier ensalada elegida ("Ensaladas: Lechuga + Tomate"), excepto "No" / "Sin ensalada"
        if (p.detalle && /ensaladas?: (?!no\b|sin ensalada)/i.test(p.detalle)) {
          ensaladasCount += (Number(p.cantidad) || 1);
        }
      }

      const div = document.createElement('div');
      div.className = `pedido-item ${p.estado === 'anulado' ? 'anulado' : ''}`;

      const emp = (p.empresa || 'Particular').toLowerCase();
      const badgeCls = emp.includes('foodpro') ? 'badge-foodpro' : emp.includes('europer') ? 'badge-europer' : 'badge-particular';
      const esEspecial = p.detalle && /\[ESPECIAL\]|plato especial/i.test(p.detalle);

      div.innerHTML = `
        <div class="pedido-header">
          <span class="cliente-title">${esc(p.cliente || 'Anónimo')} (${Number(p.cantidad) || 1})</span>
          <div>
            <span class="badge ${badgeCls}">${esc(p.empresa || 'Particular')}</span>
            ${esEspecial ? '<span class="badge badge-especial">ESPECIAL</span>' : ''}
          </div>
        </div>
        <div class="pedido-body">${esc(p.detalle || '')}</div>
        ${p.nota ? `<div class="pedido-nota">💬 "${esc(p.nota)}"</div>` : ''}
        <div class="pedido-footer">
          <span class="pedido-total">${clp(p.total)}</span>
          <div class="acciones">
            ${p.estado === 'anulado' ? '' : `<button class="btn-sm btn-ticket" onclick="imprimirTicket('${esc(p.id)}')">🖨️ Ticket</button>`}
            <button class="btn-sm ${p.estado === 'anulado' ? '' : 'btn-danger'}" onclick="toggleAnular('${esc(p.id)}', '${esc(p.estado)}')">
              ${p.estado === 'anulado' ? 'Restaurar' : 'Anular'}
            </button>
          </div>
        </div>
      `;
      cont.appendChild(div);
    });

    $('summary-cocina').innerHTML = `
      <span>🍱 Almuerzos: <b>${almuerzosCount}</b></span> |
      <span>🥣 Sopas: <b>${sopasCount}</b></span> |
      <span>🥗 Ensaladas: <b>${ensaladasCount}</b></span>
    `;
  }

  let pedidosHoy = {};
  let ancho = '80';
  try { ancho = localStorage.getItem('ticketAncho') === '58' ? '58' : '80'; } catch (e) {}
  $('ticket-ancho').value = ancho;
  $('ticket-ancho').addEventListener('change', e => {
    ancho = e.target.value;
    try { localStorage.setItem('ticketAncho', ancho); } catch (err) {}
  });

  window.imprimirTicket = id => {
    const p = pedidosHoy[id];
    if (!p) return;
    const cant = Number(p.cantidad) || 1;
    const platos = String(p.detalle || '').split(' | ').filter(Boolean)
      .map(l => '<div class="t-item">' + esc(l) + '</div>').join('');
    const t = $('ticket');
    t.className = 'w' + ancho;
    t.innerHTML = `
      <div class="t-cli">${esc(p.cliente || 'Sin nombre')} (${esc(p.empresa || 'Particular')})</div>
      <div class="t-sep"></div>
      ${cant > 1 ? '<div class="t-cant">' + cant + ' ALMUERZOS</div>' : ''}
      ${platos}
      ${p.nota ? '<div class="t-obs">Obs: ' + esc(p.nota) + '</div>' : ''}`;
    $('ticket-page').textContent = `@media print{ @page{ size:${ancho}mm auto; margin:0 } }`;
    document.body.classList.add('print-ticket');
    window.print();
  };
  window.addEventListener('afterprint', () => document.body.classList.remove('print-ticket'));

  window.toggleAnular = (id, estadoActual) => {
    const nuevoEstado = estadoActual === 'anulado' ? 'confirmado' : 'anulado';
    update(ref(db, `pedidos/${id}`), { estado: nuevoEstado });
  };
</script>
</body>
</html>
