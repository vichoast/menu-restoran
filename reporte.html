<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Registro de Pedidos por Empresa · Recursos Humanos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0; background:#F5F0E8; color:#2E2219; font:400 16px/1.5 "Nunito", system-ui, sans-serif}
  
  header{background:#B83A2A; color:#fff; padding:20px 16px}
  .wrap{max-width:960px; margin:0 auto}
  header h1{margin:0; font-size:1.5rem}
  header p{margin:4px 0 0; opacity:.9; font-size:.95rem}

  main{padding:20px 16px; max-width:960px; margin:0 auto}
  
  /* Pestañas para filtrar */
  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap}
  .tab-btn{background:#E4D8C6; border:0; padding:10px 18px; border-radius:12px; font-weight:800; cursor:pointer; color:#76665A; transition:all .15s}
  .tab-btn.active{background:#B83A2A; color:#fff}

  .card{background:#fff; border-radius:16px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .top-card{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px}
  .top-card h2{margin:0; font-size:1.2rem}
  
  .btn-print{background:#2E2219; color:#fff; border:0; padding:10px 16px; border-radius:10px; font-weight:700; cursor:pointer}
  .btn-print:hover{opacity:.9}

  .resumen-cajas{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:18px}
  .caja-kpi{background:#FBF4E8; border:1px solid #E4D8C6; border-radius:12px; padding:12px; text-align:center}
  .caja-kpi span{display:block; font-size:.82rem; color:#76665A; font-weight:700}
  .caja-kpi strong{font-size:1.4rem; color:#B83A2A; font-weight:800}

  .tabla{width:100%; border-collapse:collapse; margin-top:10px; font-size:.95rem}
  .tabla th, .tabla td{padding:12px; border-bottom:1px solid #E4D8C6; text-align:left}
  .tabla th{background:#FBF4E8; font-weight:800; color:#76665A}
  .tabla tr:hover{background:#FAF7F2}
  
  .vacio{text-align:center; color:#76665A; font-style:italic; padding:30px 0}
  .badge{background:#E1F3E8; color:#1F7A45; padding:4px 10px; border-radius:99px; font-weight:800; font-size:.85rem}
  .tag-empresa{background:#F2E3D4; color:#7D4A26; padding:2px 8px; border-radius:6px; font-weight:700; font-size:.8rem}

  @media print {
    header, .tabs, .btn-print{display:none}
    body, main, .card{background:#fff; padding:0; box-shadow:none}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>📋 Control de Pedidos por Empresa</h1>
    <p>Panel filtrado para Recursos Humanos y Encargados de Convenio</p>
  </div>
</header>

<main>
  <!-- Contenedor dinámico de Pestañas -->
  <div class="tabs" id="contenedor-tabs"></div>

  <div class="card">
    <div class="top-card">
      <div>
        <h2 id="titulo-filtro">Cargando pedidos…</h2>
        <small id="fecha-hoy" style="color:#76665A; font-weight:700"></small>
      </div>
      <button class="btn-print" onclick="window.print()">🖨️ Imprimir Lista Seleccionada</button>
    </div>

    <div class="resumen-cajas">
      <div class="caja-kpi">
        <span>Total Almuerzos</span>
        <strong id="kpi-cant">0</strong>
      </div>
      <div class="caja-kpi">
        <span>Total a Pagar</span>
        <strong id="kpi-monto">$0</strong>
      </div>
    </div>

    <div id="contenedor-tabla">
      <p class="vacio">Cargando registro de pedidos…</p>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4fIq_u9YM_wrgepR5BIjvNvzd9VQ2lI",
    authDomain: "menurestaurant-235f7.firebaseapp.com",
    databaseURL: "https://menurestaurant-235f7-default-rtdb.firebaseio.com",
    projectId: "menurestaurant-235f7",
    storageBucket: "menurestaurant-235f7.firebasestorage.app",
    messagingSenderId: "159171586731",
    appId: "1:159171586731:web:d6de4ef7c020ff9b4de5ee",
    measurementId: "G-TTMMN0X90E"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const pedidosRef = ref(db, 'pedidos');

  const clp = n => new Intl.NumberFormat('es-CL', { style:'currency', currency:'CLP', maximumFractionDigits:0 }).format(n || 0);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
  
  const hoyFecha = new Date();
  document.getElementById('fecha-hoy').textContent = 'Fecha: ' + hoyFecha.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long' });

  let todosLosPedidosHoy = [];
  let filtroActual = 'TODAS';

  function renderTabs() {
    const tabsCont = document.getElementById('contenedor-tabs');
    // Obtener las empresas únicas de los pedidos de hoy
    const empresasSet = new Set(todosLosPedidosHoy.map(p => p.empresa || 'Particular'));
    const listaEmpresas = ['TODAS', ...Array.from(empresasSet)];

    if (!listaEmpresas.includes(filtroActual)) filtroActual = 'TODAS';

    let html = '';
    listaEmpresas.forEach(emp => {
      const active = emp === filtroActual ? 'active' : '';
      const label = emp === 'TODAS' ? 'Ver Todos' : (emp === 'Particular' ? 'Clientes Particulares' : emp);
      html += `<button class="tab-btn ${active}" data-empresa="${esc(emp)}">${esc(label)}</button>`;
    });
    tabsCont.innerHTML = html;
  }

  document.getElementById('contenedor-tabs').addEventListener('click', e => {
    if (!e.target.classList.contains('tab-btn')) return;
    filtroActual = e.target.dataset.empresa;
    renderTabs();
    renderTabla();
  });

  function renderTabla() {
    const cont = document.getElementById('contenedor-tabla');
    const titulo = document.getElementById('titulo-filtro');
    const kpiCant = document.getElementById('kpi-cant');
    const kpiMonto = document.getElementById('kpi-monto');

    titulo.textContent = filtroActual === 'TODAS' 
      ? 'Mostrando: Todos los pedidos' 
      : (filtroActual === 'Particular' ? 'Mostrando: Clientes Particulares' : `Mostrando: Empresa ${filtroActual}`);

    const listaFiltrada = filtroActual === 'TODAS' 
      ? todosLosPedidosHoy 
      : todosLosPedidosHoy.filter(p => (p.empresa || 'Particular') === filtroActual);

    if (!listaFiltrada.length) {
      cont.innerHTML = '<p class="vacio">No hay pedidos registrados para esta categoría hoy.</p>';
      kpiCant.textContent = '0';
      kpiMonto.textContent = '$0';
      return;
    }

    const totalAlmuerzos = listaFiltrada.reduce((sum, p) => sum + (Number(p.cantidad) || 1), 0);
    const totalMonto = listaFiltrada.reduce((sum, p) => sum + (Number(p.total) || 0), 0);

    kpiCant.textContent = totalAlmuerzos;
    kpiMonto.textContent = clp(totalMonto);

    let html = '<table class="tabla"><thead><tr><th>N°</th><th>Hora</th><th>Trabajador / Cliente</th><th>Empresa</th><th>Detalle del Pedido</th><th>Monto</th></tr></thead><tbody>';
    
    listaFiltrada.forEach((p, index) => {
      const hora = new Date(p.fecha).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
      const emp = p.empresa || 'Particular';
      html += `<tr>
        <td><span class="badge">#${index + 1}</span></td>
        <td><b>${hora}</b></td>
        <td><b>${esc(p.cliente)}</b></td>
        <td><span class="tag-empresa">${esc(emp)}</span></td>
        <td>${esc(p.detalle)} ${p.nota ? '<br><small style="color:#76665A">Obs: ' + esc(p.nota) + '</small>' : ''}</td>
        <td><b>${clp(Number(p.total) || 0)}</b></td>
      </tr>`;
    });

    html += '</tbody></table>';
    cont.innerHTML = html;
  }

  onValue(pedidosRef, snap => {
    const data = snap.val();
    if (!data) {
      todosLosPedidosHoy = [];
    } else {
      const hoyStr = hoyFecha.toDateString();
      todosLosPedidosHoy = Object.values(data)
        .filter(p => new Date(p.fecha).toDateString() === hoyStr)
        .sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
    }
    renderTabs();
    renderTabla();
  });
</script>
</body>
</html>
