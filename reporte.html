<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Registro de Pedidos · Recursos Humanos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0; background:#F5F0E8; color:#2E2219; font:400 16px/1.5 "Nunito", system-ui, sans-serif}
  
  header{background:#B83A2A; color:#fff; padding:20px 16px}
  .wrap{max-width:900px; margin:0 auto}
  header h1{margin:0; font-size:1.5rem}
  header p{margin:4px 0 0; opacity:.9; font-size:.95rem}

  main{padding:20px 16px; max-width:900px; margin:0 auto}
  
  .card{background:#fff; border-radius:16px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .top-card{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px}
  .top-card h2{margin:0; font-size:1.2rem}
  
  .btn-print{background:#2E2219; color:#fff; border:0; padding:10px 16px; border-radius:10px; font-weight:700; cursor:pointer}
  .btn-print:hover{opacity:.9}

  .tabla{width:100%; border-collapse:collapse; margin-top:10px; font-size:.95rem}
  .tabla th, .tabla td{padding:12px; border-bottom:1px solid #E4D8C6; text-align:left}
  .tabla th{background:#FBF4E8; font-weight:800; color:#76665A}
  .tabla tr:hover{background:#FAF7F2}
  
  .vacio{text-align:center; color:#76665A; font-style:italic; padding:30px 0}
  .badge{background:#E1F3E8; color:#1F7A45; padding:4px 10px; border-radius:99px; font-weight:800; font-size:.85rem}

  @media print {
    header, .btn-print{display:none}
    body, main, .card{background:#fff; padding:0; box-shadow:none}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>📋 Control de Pedidos de Almuerzo</h1>
    <p>Panel exclusivo para Recursos Humanos y Administración</p>
  </div>
</header>

<main>
  <div class="card">
    <div class="top-card">
      <div>
        <h2 id="fecha-hoy">Cargando fecha…</h2>
        <small id="cant-pedidos" style="color:#76665A; font-weight:700">0 pedidos en total</small>
      </div>
      <button class="btn-print" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
    </div>

    <div id="contenedor-tabla">
      <p class="vacio">Cargando registro de pedidos…</p>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4fIq_u9YM_wrgepR5BIjvNvzd9VQ2lI",
    authDomain: "menurestaurant-235f7.firebaseapp.com",
    databaseURL: "https://menurestaurant-235f7-default-rtdb.firebaseio.com",
    projectId: "menurestaurant-235f7",
    storageBucket: "menurestaurant-235f7.firebasestorage.app",
    messagingSenderId: "159171586731",
    appId: "1:159171586731:web:d6de4ef7c020ff9b4de5ee",
    measurementId: "G-TTMMN0X90E"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const pedidosRef = ref(db, 'pedidos');

  const clp = n => new Intl.NumberFormat('es-CL', { style:'currency', currency:'CLP', maximumFractionDigits:0 }).format(n || 0);
  const esc = v => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
  
  const hoyFecha = new Date();
  document.getElementById('fecha-hoy').textContent = 'Pedidos del ' + hoyFecha.toLocaleDateString('es-CL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  onValue(pedidosRef, snap => {
    const data = snap.val();
    const cont = document.getElementById('contenedor-tabla');
    const cantEl = document.getElementById('cant-pedidos');

    if (!data) {
      cont.innerHTML = '<p class="vacio">Aún no hay pedidos registrados para el día de hoy.</p>';
      cantEl.textContent = '0 pedidos en total';
      return;
    }

    const hoyStr = hoyFecha.toDateString();
    const lista = Object.values(data)
      .filter(p => new Date(p.fecha).toDateString() === hoyStr)
      .sort((a, b) => new Date(a.fecha) - new Date(b.fecha)); // Ordenados por hora de llegada

    cantEl.textContent = lista.length === 1 ? '1 pedido registrado' : `${lista.length} pedidos registrados`;

    if (!lista.length) {
      cont.innerHTML = '<p class="vacio">Aún no hay pedidos registrados para el día de hoy.</p>';
      return;
    }

    let html = '<table class="tabla"><thead><tr><th>N°</th><th>Hora</th><th>Trabajador / Cliente</th><th>Detalle del Pedido</th><th>Monto</th></tr></thead><tbody>';
    
    lista.forEach((p, index) => {
      const hora = new Date(p.fecha).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
      html += `<tr>
        <td><span class="badge">#${index + 1}</span></td>
        <td><b>${hora}</b></td>
        <td><b>${esc(p.cliente)}</b></td>
        <td>${esc(p.detalle)} ${p.nota ? '<br><small style="color:#76665A">Obs: ' + esc(p.nota) + '</small>' : ''}</td>
        <td><b>${clp(Number(p.total) || 0)}</b></td>
      </tr>`;
    });

    html += '</tbody></table>';
    cont.innerHTML = html;
  });
</script>
</body>
</html>
